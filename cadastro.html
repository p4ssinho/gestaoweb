<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Cliente | Mais Gestão</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }
  </style>
</head>

<body class="bg-gray-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- HEADER -->
  <header class="w-full bg-white shadow-sm border-b border-gray-100 py-4">
    <div class="max-w-7xl mx-auto px-4 md:px-8 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <img src="img/nlogo.png" alt="Logo Programa Mais Gestão" class="h-12 w-auto object-contain">
      </a>
      <a href="index.html" class="text-xs font-bold text-[#4B5E2D] hover:text-[#96B23C] transition flex items-center gap-1">
        &larr; Voltar à Loja
      </a>
    </div>
  </header>

  <!-- FORMULARIO DE CADASTRO -->
  <main class="flex-1 flex items-center justify-center py-12 px-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 md:p-10 shadow-xl border border-gray-100">
      
      <div class="text-center mb-8">
        <div class="w-14 h-14 bg-emerald-100 text-[#4B5E2D] rounded-full flex items-center justify-center mx-auto mb-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
          </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-[#4B5E2D]">Crie sua Conta</h1>
        <p class="text-xs text-gray-500 mt-1">Preencha seus dados para ter acesso completo à Loja Oficial e conteúdos.</p>
      </div>

      <form id="formCadastroCliente" onsubmit="cadastrarCliente(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Nome Completo *</label>
          <input type="text" id="cad-nome" required
            class="w-full px-4 py-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#96B23C]"
            placeholder="Ex: João da Silva">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">E-mail *</label>
          <input type="email" id="cad-email" required
            class="w-full px-4 py-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#96B23C]"
            placeholder="seuemail@exemplo.com">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Telefone / WhatsApp</label>
            <input type="tel" id="cad-telefone"
              class="w-full px-4 py-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#96B23C]"
              placeholder="(98) 99999-9999">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">CPF / CNPJ (opcional)</label>
            <input type="text" id="cad-documento"
              class="w-full px-4 py-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#96B23C]"
              placeholder="000.000.000-00">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Senha *</label>
            <input type="password" id="cad-senha" required
              class="w-full px-4 py-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#96B23C]"
              placeholder="••••••••">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Confirmar Senha *</label>
            <input type="password" id="cad-confirma-senha" required
              class="w-full px-4 py-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#96B23C]"
              placeholder="••••••••">
          </div>
        </div>

        <button type="submit"
          class="w-full bg-[#96B23C] hover:bg-[#839d33] text-white font-bold py-3 rounded-xl transition shadow text-sm mt-4">
          Finalizar Cadastro
        </button>

        <p id="msg-cadastro" class="text-center font-bold text-xs hidden mt-2"></p>

        <p class="text-xs text-center text-gray-500 mt-6 pt-4 border-t">
          Já possui conta? <a href="index.html" class="text-[#4B5E2D] font-bold hover:underline">Voltar para a loja e Entrar</a>
        </p>
      </form>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-[#4B5E2D] text-white py-6 text-center text-xs">
    <p>© 2026 Programa Mais Gestão. Todos os direitos reservados.</p>
  </footer>

  <script>
    function cadastrarCliente(e) {
      e.preventDefault();
      const nome = document.getElementById('cad-nome').value.trim();
      const email = document.getElementById('cad-email').value.trim();
      const telefone = document.getElementById('cad-telefone').value.trim();
      const documento = document.getElementById('cad-documento').value.trim();
      const senha = document.getElementById('cad-senha').value;
      const confirmaSenha = document.getElementById('cad-confirma-senha').value;
      const msgElement = document.getElementById('msg-cadastro');

      if (senha !== confirmaSenha) {
        msgElement.textContent = "❌ As senhas não coincidem!";
        msgElement.className = "text-center font-bold text-xs text-red-600 block mt-2";
        return;
      }

      const cliente = { nome, email, telefone, documento };
      localStorage.setItem('mais_gestao_cliente', JSON.stringify(cliente));

      msgElement.textContent = "🎉 Cadastro realizado com sucesso! Redirecionando para a loja...";
      msgElement.className = "text-center font-bold text-xs text-emerald-600 block mt-2";

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1200);
    }
  </script>
</body>

</html>
