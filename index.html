<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mais Gestão</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; }
    
    /* Efeito de sobreposição idêntico à imagem: Amarelo sólido na esquerda que some em degradê para a direita */
    /* Novo Efeito de sobreposição: Verde Escuro na esquerda sumindo em degradê */
    .hero-gradient {
      background: linear-gradient(to right, 
        rgba(75, 94, 45, 1) 0%,    /* Verde escuro sólido no início */
        rgba(75, 94, 45, 0.9) 35%, /* Começa a dar transparência */
        rgba(75, 94, 45, 0.2) 75%, /* Bem transparente sobre a foto */
        rgba(75, 94, 45, 0) 100%   /* Totalmente transparente no final */
      );
    }
  </style>
</head>
<body class="bg-white text-slate-800">

  <header class="w-full bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 md:px-8 h-20 flex items-center justify-between">
      
      <div class="flex items-center gap-2">
        <img src="img/nlogo.png" alt="Logo Programa Mais Gestão" class="h-12 w-auto object-contain">
      </div>

      <nav class="hidden lg:flex items-center gap-6 text-xs font-bold text-[#0073bc]">
        <a href="#" class="bg-[#cedc00] p-1.5 rounded-md hover:opacity-90 transition mr-2">
          <svg class="w-5 h-5 text-emerald-700" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.4.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.713-1.457L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.864-9.742.002-2.602-1.005-5.05-2.839-6.89C16.608 2.136 14.17 1.13 11.583 1.13c-5.441 0-9.865 4.371-9.869 9.743-.001 1.749.462 3.456 1.343 4.978l-.993 3.63 3.731-.967z"/></svg>
        </a>
        <a href="#" class="text-cyan-500 border-b-2 border-cyan-500 pb-1">Início</a>
        <a href="#" class="hover:text-cyan-600 transition">Quem Somos</a>
        <a href="#" class="hover:text-cyan-600 transition">Atuação</a>
        <a href="#" class="hover:text-cyan-600 transition">Cursos</a>
        <a href="#" class="hover:text-cyan-600 transition">Inscrições</a>
        <a href="#" class="hover:text-cyan-600 transition">Notícias</a>
        <a href="#" class="hover:text-cyan-600 transition">Contato</a>
      </nav>
    </div>
  </header>

  <section class="relative w-full h-[550px] bg-slate-100 overflow-hidden">
    
    <div class="absolute inset-0 z-0">
      <img 
        src="img/elenco.png" 
        alt="Membros" 
        class="w-full h-full object-cover object-right md:object-center"
      >
    </div>

    <div class="absolute inset-0 hero-gradient z-10"></div>

    <div class="absolute inset-0 z-20 max-w-7xl mx-auto px-6 md:px-12 flex items-center">
      <div class="max-w-xl text-left">
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-wider text-white uppercase leading-tight drop-shadow-sm">
           Programa<br>
           Mais<br>
           Gestão

        </h1>
      </div>
    </div>

  </section>

</body>
</html>
